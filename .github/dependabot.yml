version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

    # Why this exists:
    # Expo and React Native projects are extremely sensitive to package versions.
    # A single version mismatch of a native module or core library can break compilation,
    # crash autolinking, or cause runtime failures. These rules protect the application
    # by ensuring Dependabot does not suggest updates that conflict with the Expo SDK 55 release.
    ignore:
      # Why this exists:
      # The core React, React Native, and Expo packages must stay at the exact versions
      # aligned with the Expo SDK 55 release. Upgrading these directly will break compatibility.
      # Tricky logic:
      # We use "*" wildcard to ignore ALL updates for these core libraries.
      - dependency-name: "react"
        versions: ["*"]
      - dependency-name: "react-native"
        versions: ["*"]
      - dependency-name: "expo"
        versions: ["*"]
      - dependency-name: "@types/react"
        versions: ["*"]
      - dependency-name: "@types/react-native"
        versions: ["*"]
      - dependency-name: "babel-preset-expo"
        versions: ["*"]

      # Why this exists:
      # Expo SDK modules (like expo-font, expo-splash-screen) are pinned to specific SDK-compatible versions.
      # Dependabot must never update them, as doing so bypasses 'npx expo install' safety checks.
      # Tricky logic:
      # We use 'expo-*' glob wildcard to capture all standard Expo packages.
      - dependency-name: "expo-*"
        versions: ["*"]

      # Why this exists:
      # React Native third-party packages with native Android/iOS bindings (like reanimated, gesture-handler, svg)
      # have tight compilation dependencies on specific React Native and Gradle versions.
      # We lock major and minor updates of these libraries, but allow patch releases for critical security/bug fixes.
      # Tricky logic:
      # We use globs ('react-native-*', '@react-native-*/*', '@react-navigation/*') to catch all community packages
      # and native-linked dependencies, and restrict update-types to semver-major and semver-minor.
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-*/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-navigation/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
