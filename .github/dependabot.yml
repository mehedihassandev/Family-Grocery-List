version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

    # Why this exists:
    # Core framework packages (React, React Native, Expo) must stay aligned with
    # the Expo SDK 55 release level. Upgrading these directly will break the framework foundation.
    # All other community and native packages are allowed to be updated by Dependabot,
    # as their compatibility is dynamically verified and auto-aligned by our CI workflows.
    ignore:
      # Why this exists:
      # Core framework modules are locked to the specific Expo SDK release.
      # Upgrading these individually will break autolinking and build scripts.
      # Tricky logic:
      # We use "*" wildcard to ignore ALL updates for these core packages.
      - dependency-name: "react"
        versions: ["*"]
      - dependency-name: "react-native"
        versions: ["*"]
      - dependency-name: "expo"
        versions: ["*"]
      - dependency-name: "@types/react"
        versions: ["*"]
      - dependency-name: "@types/react-native"
        versions: ["*"]
      - dependency-name: "babel-preset-expo"
        versions: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
