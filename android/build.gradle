// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle:9.2.1')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

ext {
  // We define this property globally in the root project extension so that all autolinked packages
  // (such as react-native-svg) can immediately resolve the react-native package directory
  // without running the 'node' CLI process during configuration sync. This completely bypasses
  // issues where Gradle sync fails inside GUI editors (like Android Studio on macOS) due to missing PATH values.
  REACT_NATIVE_NODE_MODULES_DIR = file("${rootDir}/../node_modules/react-native")
}


allprojects {
  repositories {
    google()
    mavenCentral()
    // AsyncStorage v3 ships local Android artifacts under node_modules.
    maven { url("$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo") }
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
